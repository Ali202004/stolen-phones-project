<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 95%; max-width: 400px; }
        .alert-red { color: #dc3545; font-size: 0.85rem; border: 1px solid #dc3545; padding: 10px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h4 class="text-center mb-3">إضافة بلاغ جديد</h4>
        <div class="alert-red text-center">⚠️ تنبيه: العثور على الهاتف يتطلب دفع 5000 ريال للمهندس.</div>
        <form action="/add" method="POST">
            <input type="text" name="imei" class="form-control mb-3" placeholder="رقم الـ IMEI" required>
            <input type="tel" name="phone" class="form-control mb-3" placeholder="رقم الهاتف" required>
            <select name="brand" class="form-select mb-3">
                <option>Vivo</option><option>Samsung</option><option>LT</option>
            </select>
            <input type="text" name="city" class="form-control mb-3" placeholder="المدينة" required>
            <input type="date" name="date" class="form-control mb-3" required>
            <button class="btn btn-success w-100 py-2">حفظ البلاغ</button>
        </form>
    </div>
</body>
</html>
