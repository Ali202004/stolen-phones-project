<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to bottom, #8e9eab, #eef2f3); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 400px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>
    <div class="card">
        <h4 class="text-center">إضافة بلاغ مفقود</h4>
        <small class="text-danger text-center d-block mb-3">تنبيه: العثور على الهاتف يتطلب دفع 5000 ريال للمهندس.</small>
        <form action="/add" method="POST">
            <input type="text" name="imei" class="form-control mb-3" placeholder="رقم الـ IMEI" required>
            <input type="text" name="phone" class="form-control mb-3" placeholder="رقم الهاتف">
            <select name="brand" class="form-select mb-3">
                <option value="Vivo">Vivo</option>
                <option value="Samsung">Samsung</option>
            </select>
            <input type="text" name="city" class="form-control mb-3" placeholder="المدينة">
            <input type="date" name="date" class="form-control mb-3">
            <button type="submit" class="btn btn-success w-100">حفظ البلاغ</button>
        </form>
        <a href="/" class="btn btn-link w-100 mt-2">العودة للرئيسية</a>
    </div>
</body>
</html>
