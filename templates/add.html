<!<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        .alert-custom { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; border-radius: 10px; padding: 10px; margin-bottom: 20px; font-weight: bold; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h4 class="text-center mb-3">إضافة بلاغ جديد</h4>
        
        <div class="alert-custom">
            ⚠️ تنبيه: في حال تم العثور على الهاتف، يتطلب دفع مبلغ 5000 ريال للمهندس.
        </div>

        <form action="/add" method="POST">
            <input type="text" name="imei" class="form-control mb-2" placeholder="رقم الـ IMEI" required>
            <input type="tel" name="phone" class="form-control mb-2" placeholder="رقم الهاتف" required>
            <select name="brand" class="form-select mb-2">
                <option value="Vivo">Vivo</option>
                <option value="Samsung">Samsung</option>
                <option value="LT">LT</option>
            </select>
            <input type="text" name="city" class="form-control mb-2" placeholder="المدينة" required>
            <input type="date" name="date" class="form-control mb-2" required>
            <button class="btn btn-success w-100 mt-2">حفظ البلاغ</button>
            <a href="/" class="btn btn-link w-100 mt-2">العودة للرئيسية</a>
        </form>
    </div>
</body>
</html>
