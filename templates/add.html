<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>إضافة بلاغ</title>
</head>
<body>
    <div class="container">
        <h2>إضافة بلاغ جديد</h2>
        <form action="/add" method="POST">
            <input type="text" name="imei" placeholder="رقم الـ IMEI" required>
            <select name="brand">
                <option value="Samsung">Samsung</option>
                <option value="Vivo">Vivo</option>
                <option value="LT">LT</option>
                <option value="Other">أجهزة أخرى</option>
            </select>
            <button type="submit">حفظ البلاغ</button>
        </form>
        <br><a href="/">العودة للرئيسية</a>
    </div>
</body>
</html>
