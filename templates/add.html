<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container shadow p-4 bg-white rounded" style="max-width: 500px;">
        <h4 class="mb-4">إضافة بلاغ جديد</h4>
        <form action="/add" method="POST">
            <select name="brand" class="form-select mb-3" required>
                <option value="Samsung">سامسونج</option>
                <option value="Apple">آيفون</option>
                <option value="Vivo">فيفو</option>
                <option value="LT">LT</option>
                <option value="Other">أخرى</option>
            </select>
            <input type="text" name="imei" class="form-control mb-3" placeholder="رقم الـ IMEI" required>
            <input type="text" name="city" class="form-control mb-3" placeholder="المدينة" required>
            <input type="date" name="date" class="form-control mb-3" required>
            <input type="tel" name="phone" class="form-control mb-3" placeholder="رقم الهاتف" required>
            <button type="submit" class="btn btn-success w-100">حفظ البلاغ</button>
        </form>
        <a href="/" class="btn btn-link w-100 mt-2">العودة للرئيسية</a>
    </div>
</body>
</html>
