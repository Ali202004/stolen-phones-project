<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* خلفية متدرجة عصرية (Gradient) جذابة وأنيقة */
            background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .report-card {
            background: rgba(255, 255, 255, 0.95); /* خلفية بيضاء شفافة قليلاً */
            border-radius: 20px; /* حواف ناعمة جداً */
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); /* ظل ناعم لإعطاء عمق */
            width: 100%;
            max-width: 450px; /* عرض محدد ليبقى أنيقاً */
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px); /* تأثير ضبابي للخلفية (Glassmorphism light) */
        }

        h2 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-control, .form-select {
            border-radius: 10px; /* حواف الحقول ناعمة */
            padding: 12px 15px;
            border: 1px solid #e1e8ed;
            background-color: #fcfcfc;
            margin-bottom: 15px;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.1); /* لون تركيز أخضر ناعم */
            border-color: #28a745;
        }

        .btn-success-custom {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-success-custom:hover {
            background: linear-gradient(135deg, #218838 0%, #1e7e34 100%);
            transform: translateY(-2px); /* تأثير حركة بسيط عند التحويم */
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #2c3e50;
        }
    </style>
    <title>إضافة بلاغ جديد | أنيق وعصري</title>
</head>
<body>
    <div class="report-card">
        <h2>إضافة بلاغ جديد</h2>
        <form action="/add" method="POST">
            <input type="text" name="imei" class="form-control" placeholder="رقم الـ IMEI (صحيح ومكون من 15 رقم)" required>
            
            <select name="brand" class="form-select" required>
                <option value="" disabled selected>اختر نوع الجهاز</option>
                <option value="Samsung">سامسونج (Samsung)</option>
                <option value="Apple">آيفون (Apple)</option>
                <option value="Xiaomi">شاومي (Xiaomi)</option>
                <option value="Other">أجهزة أخرى</option>
            </select>

            <input type="text" name="city" class="form-control" placeholder="المدينة" required>
            <input type="date" name="date" class="form-control" required>
            
            <input type="tel" name="phone" class="form-control" placeholder="رقم الهاتف للتواصل (مهم)" required>
            
            <button type="submit" class="btn btn-success-custom">حفظ البلاغ</button>
        </form>
        <a href="/" class="back-link">العودة للرئيسية</a>
    </div>
</body>
</html>
