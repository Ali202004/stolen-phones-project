<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تتبع الأجهزة المفقودة</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: inline-block; }
        input { padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .links { margin-top: 20px; }
        a { text-decoration: none; color: #007bff; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>نظام تتبع الأجهزة المفقودة</h1>
        <p>ابحث عن جهازك باستخدام رقم الـ IMEI</p>
        
        <form action="/search" method="GET">
            <input type="text" name="imei" placeholder="أدخل رقم الـ IMEI المكون من 15 رقم" required>
            <br>
            <button type="submit">بحث عن الجهاز</button>
        </form>

        <div class="links">
            <a href="/add">➕ إضافة بلاغ جديد</a>
            <span> | </span>
            <a href="/reports">📋 عرض كل البلاغات</a>
        </div>
    </div>
</body>
</html>
