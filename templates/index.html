<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .marquee { background: #343a40; color: white; padding: 10px; overflow: hidden; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="marquee"><marquee>صلى الله على نبينا محمد - اذكروا الله - أهلاً بكم في نظام كشف المسروقات الرسمي</marquee></div>
    <div class="container mt-5 text-center">
        <h1>نظام كشف الأجهزة</h1>
        <form action="/search" method="POST" class="mt-4">
            <input type="text" name="imei" class="form-control w-50 mx-auto" placeholder="أدخل رقم الـ IMEI">
            <button class="btn btn-primary mt-2">بحث عن الجهاز</button>
        </form>
        {% if report %}
            <div class="alert alert-success mt-3">الجهاز موجود: {{ report[1] }} في مدينة {{ report[3] }}</div>
        {% elif imei %}
            <div class="alert alert-danger mt-3">لم يتم العثور على الجهاز</div>
        {% endif %}
        <a href="/add" class="btn btn-success mt-3">إضافة بلاغ جديد</a>
    </div>
</body>
</html>
