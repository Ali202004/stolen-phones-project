<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>نظام بلاغات الأجهزة</title>
</head>
<body class="bg-light p-4">
    <div class="container shadow p-4 bg-white rounded">
        <h2>نظام البلاغات</h2>
        
        <form method="POST" class="mb-4">
            <input type="text" name="search_imei" class="form-control" placeholder="أدخل رقم الـ IMEI للبحث">
            <button type="submit" class="btn btn-primary mt-2">بحث</button>
        </form>
        {% if search_result %} <div class="alert alert-info">{{ search_result }}</div> {% endif %}

        <hr>
        
        <h3>إضافة بلاغ جديد</h3>
        <form action="/add" method="POST">
            <input type="text" name="imei" class="form-control mb-2" placeholder="رقم الـ IMEI" required>
            <input type="text" name="city" class="form-control mb-2" placeholder="المدينة" required>
            <input type="date" name="date" class="form-control mb-2" required>
            <input type="tel" name="phone" class="form-control mb-2" placeholder="رقم الهاتف للتواصل" required>
            <button type="submit" class="btn btn-success">حفظ البلاغ</button>
        </form>
    </div>
</body>
</html>
