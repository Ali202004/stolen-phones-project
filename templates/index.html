<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; color: white; display: flex; align-items: center; justify-content: center; }
        .hero { background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 25px; backdrop-filter: blur(10px); width: 90%; max-width: 450px; text-align: center; }
        .btn-custom { background: #00d2ff; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; }
    </style>
</head>
<body>
    <div class="hero">
        <h3>نظام كشف المسروقات</h3>
        <form action="/search" method="POST" class="mt-4">
            <input type="text" name="imei" class="form-control mb-3" placeholder="أدخل رقم الـ IMEI للبحث" required>
            <button class="btn btn-custom">بحث عن الجهاز</button>
        </form>
        {% if searched %}
            {% if report %}
                <div class="alert alert-danger mt-3">الجهاز موجود في قاعدة البيانات: مفقود في {{ report[2] }} للتواصل: {{ report[4] }}</div>
            {% else %}
                <div class="alert alert-success mt-3">الجهاز غير موجود (سليم).</div>
            {% endif %}
        {% endif %}
        <br><a href="/add" class="text-white">إضافة بلاغ جديد</a>
    </div>
</body>
</html>
