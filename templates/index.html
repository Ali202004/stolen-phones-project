<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .hero { background: linear-gradient(135deg, #2c3e50, #4ca1af); color: white; padding: 2rem; border-radius: 1.5rem; }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width: 600px;">
        <div class="hero text-center mb-4">
            <h2>نظام كشف المسروقات</h2>
        </div>

        <div class="d-flex justify-content-center gap-2 mb-4 overflow-auto">
            <a href="/search?brand=Samsung" class="btn btn-outline-dark rounded-pill">سامسونج</a>
            <a href="/search?brand=Vivo" class="btn btn-outline-dark rounded-pill">فيفو</a>
            <a href="/search?brand=LT" class="btn btn-outline-dark rounded-pill">LT</a>
        </div>

        <div class="card p-4 shadow-sm">
            <form method="POST">
                <input type="text" name="search_imei" class="form-control mb-3" placeholder="أدخل رقم الـ IMEI">
                <button type="submit" class="btn btn-primary w-100">بحث ذكي</button>
            </form>
            {% if search_result %}<div class="alert alert-info mt-3">{{ search_result }}</div>{% endif %}
        </div>
        
        <a href="/add" class="btn btn-success w-100 mt-4">إضافة بلاغ جديد</a>
    </div>
</body>
</html>
