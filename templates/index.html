<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تتبع الأجهزة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1); width: 95%; max-width: 400px; padding: 30px; }
        .btn-custom { transition: 0.3s; }
        .btn-custom:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="card text-center">
        <h2 class="mb-4 text-primary">نظام تتبع الأجهزة</h2>
        <p class="text-muted mb-4">أدخل رقم الـ IMEI للبحث عن جهازك</p>

        <form action="/search" method="GET">
            <div class="mb-3">
                <input type="text" name="imei" class="form-control form-control-lg text-center" placeholder="رقم الـ IMEI (15 رقم)" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 btn-custom shadow-sm mb-3">بحث عن الجهاز</button>
        </form>

        <hr>

        <div class="d-grid gap-2 mt-3">
            <a href="/add" class="btn btn-success btn-custom">➕ إضافة بلاغ جديد</a>
            <a href="/reports" class="btn btn-outline-secondary btn-custom">📋 عرض كل البلاغات</a>
        </div>
    </div>

</body>
</html>
