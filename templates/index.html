<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; text-align: center; padding-top: 50px; }
        .box { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="box">
        <h3>نظام كشف المسروقات</h3>
        <form action="/search" method="POST">
            <input type="text" name="imei" class="form-control mb-3" placeholder="أدخل رقم الـ IMEI" required>
            <button class="btn btn-primary w-100">بحث</button>
        </form>
        {% if report %}
        <div class="alert alert-danger mt-3">
            الجهاز مفقود في مدينة {{ report[3] }} <br>
            التاريخ: {{ report[4] }} <br>
            للتواصل: {{ report[5] }}
        </div>
        {% elif imei %}
        <div class="alert alert-success mt-3">الجهاز غير موجود في قائمة البلاغات.</div>
        {% endif %}
        <hr>
        <a href="/add" class="btn btn-success">إضافة بلاغ جديد</a>
    </div>
</body>
</html>
