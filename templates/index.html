<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; min-height: 100vh; }
        .hero { padding: 50px 0; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .marquee { background: rgba(255, 255, 255, 0.05); padding: 10px; color: #ffeb3b; font-weight: bold; }
    </style>
</head>
<body>
    <div class="marquee"><marquee>صلى الله على نبينا محمد ﷺ - اذكروا الله - نظام كشف الأجهزة المفقودة - خدمة رسمية</marquee></div>
    <div class="container text-center hero">
        <h1 class="mb-4">نظام كشف المسروقات الذكي</h1>
        <div class="glass-card mx-auto" style="max-width: 500px;">
            <form action="/search" method="POST">
                <input type="text" name="imei" class="form-control mb-3" placeholder="أدخل رقم الـ IMEI" required>
                <button class="btn btn-primary w-100">بحث ذكي عن الجهاز</button>
            </form>
            {% if report %}
                <div class="alert alert-danger mt-3">⚠️ الجهاز مفقود: {{ report[0] }} | المدينة: {{ report[2] }} | التواصل: {{ report[4] }}</div>
            {% elif imei %}
                <div class="alert alert-success mt-3">✅ الجهاز غير مسجل كـ "مفقود".</div>
            {% endif %}
        </div>
        <a href="/add" class="btn btn-outline-light mt-4">إضافة بلاغ جديد</a>
    </div>
</body>
</html>
