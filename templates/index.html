<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; color: white; display: flex; align-items: center; justify-content: center; }
        .hero { background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 25px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); width: 90%; max-width: 450px; text-align: center; }
        input { border-radius: 10px !important; padding: 12px !important; }
        .btn-custom { background: #00d2ff; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; transition: 0.3s; }
        .btn-custom:hover { transform: scale(1.05); background: #3a7bd5; }
    </style>
</head>
<body>
    <div class="hero">
        <h2 class="mb-4">نظام كشف المسروقات</h2>
        <form action="/search" method="POST">
            <input type="text" name="imei" class="form-control mb-3" placeholder="أدخل رقم الـ IMEI" required>
            <button class="btn btn-custom">بحث عن الجهاز</button>
        </form>
        <a href="/add" class="text-white mt-3 d-block">إضافة بلاغ جديد</a>
    </div>
</body>
</html>
