<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة البلاغات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .table-container { background: white; padding: 20px; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <div class="table-container">
            <h3 class="text-center mb-4 text-primary">سجل البلاغات</h3>
            
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th>الـ IMEI</th>
                            <th>رقم الهاتف</th>
                            <th>نوع الجهاز</th>
                            <th>المدينة</th>
                            <th>التاريخ</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for report in reports %}
                        <tr>
                            <td>{{ report.imei }}</td>
                            <td>{{ report.phone }}</td>
                            <td>{{ report.brand }}</td>
                            <td>{{ report.city }}</td>
                            <td>{{ report.date }}</td>
                        </tr>
                        {% endfor %}
                        </tbody>
                </table>
            </div>
            <div class="text-center mt-4">
                <a href="/" class="btn btn-outline-primary">العودة للرئيسية</a>
            </div>
        </div>
    </div>
</body>
</html>
