<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="marquee-bar"><marquee>صلى على النبي.. اذكر الله.. لا إله إلا الله</marquee></div>
    <div class="container" style="margin-top: 60px;">
        <h2>نظام كشف المسروقات</h2>
        <input type="text" id="imei" placeholder="أدخل جزء من الـ IMEI">
        <button onclick="searchIMEI()">بحث ذكي</button>
        <div id="result"></div>
        <hr>
        <h3>تصفح حسب الشركة</h3>
        <button onclick="filterByBrand('Samsung')">Samsung</button>
        <button onclick="filterByBrand('Vivo')">Vivo</button>
        <button onclick="filterByBrand('LT')">LT</button>
        <div id="results-table"></div>
        <br><a href="/add">إضافة بلاغ جديد</a>
    </div>
    <script>
        function searchIMEI() {
            fetch('/?imei=' + document.getElementById('imei').value).then(r => r.text()).then(d => document.getElementById('result').innerHTML = d);
        }
        function filterByBrand(brand) {
            fetch('/search?brand=' + brand).then(r => r.text()).then(d => document.getElementById('results-table').innerHTML = d);
        }
    </script>
</body>
</html>
